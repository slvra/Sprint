<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint</title>
    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
        }
        .container {
            max-width: 400px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 20px;
            box-shadow: 2px 2px 12px rgba(0, 0, 0, 0.2);
        }
        .hidden {
            display: none;
        }
        input, button {
            margin-top: 10px;
            padding: 8px;
            width: 90%;
        }
    </style>
</head>
<body>
    <h1>Desafio Sprint - Adan Silveira</h1>
    <!-- <div class="div-imagem"></div> -->

    <!-- Div inicial -->
    <div class="container" id="perguntasDiv">
        <h3>Calculadora Sprint</h3>
        <label>Qual a distância percorrida de sua casa até seu trabalho (em km)?</label>
        <input type="text" id="resposta1">
        
        <label>Qual o consumo médio do veículo (km/L)?'</label>
        <input type="text" id="resposta2">
        
        <label>Em quantos postos você pesquisou?</label>
        <input type="text" id="numPostos">
        
        <button onclick="prosseguir()">Próximo</button>
    </div>

    <!-- Div de Inputs dos Postos -->
    <div class="container hidden" id="postosDiv">
        <h3>Digite os valores (em R$) encontrados nos postos</h3>
        <div id="postosInputs"></div>
        <button onclick="calcularValores()">Próximo</button>
    </div>

    <!-- Div dos Resultados -->
    <div class="container hidden" id="resultadoDiv">
        <h3>Resultados</h3>
        <p id="resultadoFinal"></p>
        <button onclick="reiniciar()">Encerrar</button>
    </div>

    <script>
        let resposta1, resposta2, numPostos, valoresPostos = [];

        function isFloat(value) {
            return /^\d+(\.\d+)?$/.test(value);
        }

        function isInteger(value) {
            return /^\d+$/.test(value);
        }

        function prosseguir() {
            let resposta1Validar = document.getElementById("resposta1").value.trim();
            let resposta2Validar = document.getElementById("resposta2").value.trim();
            let numPostoValidar = document.getElementById("numPostos").value.trim();

            if (!isFloat(resposta1Validar)) {
                alert("A distância deve ser um número válido (ex: 10.5).");
                return;
            }

            if (!isFloat(resposta2Validar)) {
                alert("O consumo deve ser um número válido (ex: 20.75).");
                return;
            }

            if (!isInteger(numPostoValidar) || parseInt(numPostoValidar) <= 0) {
                alert("O número de postos deve ser um número inteiro positivo.");
                return;
            }

            resposta1 = parseFloat(resposta1Validar);
            resposta2 = parseFloat(resposta2Validar);
            numPostos = parseInt(numPostoValidar);

            document.getElementById("perguntasDiv").classList.add("hidden");
            document.getElementById("postosDiv").classList.remove("hidden");

            let postosInputs = document.getElementById("postosInputs");
            postosInputs.innerHTML = "";  

            for (let i = 0; i < numPostos; i++) {
                let input = document.createElement("input");
                input.type = "text"; // Permitir números float corretamente
                input.placeholder = `Valor do posto ${i + 1}`;
                input.id = `posto${i}`;
                postosInputs.appendChild(input);
            }
        }

        function calcularValores() {
            valoresPostos = [];
            for (let i = 0; i < numPostos; i++) {
                let valorTeste = document.getElementById(`posto${i}`).value.trim();
                
                if (!isFloat(valorTeste)) {
                    alert("Insira valores numéricos válidos (ex: 5.50) para todos os postos.");
                    return;
                }

                let valor = parseFloat(valorTeste);
                valoresPostos.push(valor);
            }

            let soma = valoresPostos.reduce((a, b) => a + b, 0);
            let media = soma / valoresPostos.length;
            let menorValor = Math.min(...valoresPostos);

            document.getElementById("postosDiv").classList.add("hidden");
            document.getElementById("resultadoDiv").classList.remove("hidden");

            document.getElementById("resultadoFinal").innerHTML = `
                
                O consumo necessário é: ${(resposta1/resposta2).toFixed(2)} litros <br>
                O menor valor pesquisado é R$ ${menorValor.toFixed(2)} <br>
                A média dos valores pesquisados é R$ ${media.toFixed(2)} <br>
                O gasto diário (ida e volta) é R$ ${(resposta1/resposta2*menorValor).toFixed(2)}<br>

            `;
        }

        function reiniciar() {
            document.getElementById("perguntasDiv").classList.remove("hidden");
            document.getElementById("postosDiv").classList.add("hidden");
            document.getElementById("resultadoDiv").classList.add("hidden");

            document.getElementById("resposta1").value = "";
            document.getElementById("resposta2").value = "";
            document.getElementById("numPostos").value = "";
        }
    </script>

</body>
</html>
